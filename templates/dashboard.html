<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>小红书 · 电商竞品情报</title>
<style>
:root{--ink:#182326;--muted:#586967;--paper:#f3f5f0;--line:#dbe3d8;--green:#1d654c;--lime:#d9f27f;--orange:#b9582d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.65 system-ui,'Microsoft YaHei',sans-serif}a{color:var(--green);text-underline-offset:3px}header{background:#153f35;color:white;padding:30px 5vw 24px}header small{letter-spacing:3px;color:#bad7be}h1{font-size:clamp(23px,3vw,38px);margin:6px 0}h2{font-size:19px;margin:0 0 15px}h3{font-size:15px;margin:0 0 8px}p{margin:6px 0}main{max-width:1480px;margin:auto;padding:24px 4vw 60px}.status{background:var(--lime);color:#223821;padding:6px 12px;border-radius:5px;display:inline-block}.notice{background:#fff4de;border:1px solid #e8d4a5;padding:12px 16px;margin-bottom:20px;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card,section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px}.metric{font-size:30px;line-height:1.3;font-weight:700}.muted{color:var(--muted);font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.badge{display:inline-block;font-size:11px;white-space:nowrap;padding:2px 7px;border-radius:4px;background:#e8f1ec;color:#215741;margin-right:5px}.INFERENCE{background:#fff0df;color:#975224}.ANALYSIS{background:#edf0fc;color:#475b92}.claim{border-bottom:1px solid #edf0ea;padding:9px 0}.claim:last-child{border-bottom:0}.evidence-links{display:block;font-size:11px;margin-top:5px;overflow-wrap:anywhere}.evidence-links a{margin-right:9px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:top}th{color:var(--muted);font-size:11px}.scroll{overflow:auto}button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:9px 16px;cursor:pointer;margin:0 8px 10px 0}button.active{background:var(--green);color:white}details{border-top:1px solid var(--line);padding:10px 0}summary{cursor:pointer;font-weight:600}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto;background:#f5f6f1;padding:12px}.bar{height:7px;background:#e8eee5;border-radius:10px;margin:8px 0}.bar i{display:block;height:7px;background:var(--green);border-radius:10px}.pill{display:inline-block;background:#f1f4eb;padding:5px 9px;margin:3px;border-radius:6px}.hypothesis{margin:9px 0;padding:12px;background:#f7f8f3;border-radius:8px}nav{position:sticky;top:0;background:var(--paper);padding:12px 0;z-index:2}nav a{margin-right:17px;text-decoration:none;font-weight:600}.panel[hidden]{display:none}.source:target{outline:3px solid #9dbd4c;background:#f8fce9}img{max-width:120px;max-height:140px;border-radius:6px}.footer{color:var(--muted);margin-top:20px;font-size:12px}input{padding:8px;border:1px solid var(--line);border-radius:6px;max-width:100%}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}main{padding:18px}header{padding:24px 18px}nav{font-size:12px}}@media print{nav,button,input{display:none}.panel[hidden]{display:block}section,.card{break-inside:avoid}}
</style></head><body>
<header><small>PUBLIC DATA / COMMERCE INTELLIGENCE</small><h1>小红书电商竞品情报</h1><p>@@ACCOUNT@@</p><span class="status">@@STATUS@@</span></header>
<main>@@BODY@@<p class="footer">互动表现 ≠ 成交表现 · 商品出现频次 ≠ 商品利润 · 所有建议均需实验验证<br>本文件包含内联样式、交互和证据摘录，可离线独立打开。外部原文链接需要联网。</p></main>
<script>
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!==b.dataset.tab)}));
document.querySelectorAll('a[href^="#ev-"]').forEach(a=>a.addEventListener('click',()=>{const e=document.getElementById(a.getAttribute('href').slice(1));if(e)e.open=true}));
const q=document.getElementById('evidence-search');if(q)q.addEventListener('input',()=>document.querySelectorAll('.source').forEach(e=>e.hidden=!e.textContent.toLowerCase().includes(q.value.toLowerCase())));
</script></body></html>
